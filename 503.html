<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>503 - Server Sedang Sibuk | OSIS SMKN 1 Bantul</title>

    <meta name="description" content="Server sedang sibuk atau dalam pemeliharaan. Silakan coba beberapa saat lagi.">

    <meta name="robots" content="noindex">

    <link rel="icon" type="image/jpeg" href="https://apwgipefbiszpeoyvfta.supabase.co/storage/v1/object/public/foto/logo-osis.jpg">

    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#ffffff">

    <style>
        :root{
            --bg:#ffffff;
            --line:rgba(15,17,21,.09);
            --ink:#14161c;
            --ink-dim:#767c88;
            --gold:#a9822f;
            --gold-bg:#14161c;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html,body{ height:100%; }

        body{
            font-family:"Georgia","Segoe UI",Tahoma,sans-serif;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:28px;
            color:var(--ink);
            background:
                radial-gradient(ellipse 70% 55% at 50% -8%, rgba(169,130,47,.06), transparent 60%),
                var(--bg);
            position:relative;
            overflow:hidden;
        }

        body::before{
            content:"";
            position:fixed;
            inset:0;
            background-image:
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size:64px 64px;
            opacity:.5;
            mask-image:radial-gradient(ellipse 70% 60% at 50% 30%, black, transparent 75%);
            pointer-events:none;
        }

        .card{
            position:relative;
            z-index:1;
            max-width:560px;
            width:100%;
            text-align:center;
            padding:64px 48px;
            border:1px solid var(--line);
            border-radius:4px;
            background:#fff;
            box-shadow:0 30px 70px -30px rgba(15,17,21,.12);
            animation:fade .8s ease both;
        }

        @keyframes fade{
            from{ opacity:0; transform:translateY(14px); }
            to{ opacity:1; transform:translateY(0); }
        }

        .logo{
            width:96px;
            height:96px;
            border-radius:8px;
            margin-bottom:30px;
            object-fit:contain;
        }

        .eyebrow{
            font-family:"Segoe UI",Tahoma,sans-serif;
            font-size:11px;
            font-weight:700;
            letter-spacing:.32em;
            text-transform:uppercase;
            color:var(--gold);
            margin-bottom:22px;
        }

        .error{
            font-size:clamp(56px,10vw,84px);
            font-weight:400;
            line-height:1;
            letter-spacing:.02em;
            color:var(--ink);
            font-family:"Georgia",serif;
        }

        .rule{
            width:44px;
            height:1px;
            background:var(--gold);
            margin:28px auto;
            opacity:.7;
        }

        h1{
            font-family:"Segoe UI",Tahoma,sans-serif;
            font-size:19px;
            font-weight:700;
            color:var(--ink);
            text-transform:uppercase;
            letter-spacing:.08em;
        }

        p{
            font-family:"Segoe UI",Tahoma,sans-serif;
            margin:20px auto 0;
            max-width:400px;
            color:var(--ink-dim);
            line-height:1.85;
            font-size:14.5px;
            font-weight:400;
        }

        .btn-group{
            margin-top:42px;
            display:flex;
            justify-content:center;
            gap:16px;
            flex-wrap:wrap;
        }

        .btn{
            font-family:"Segoe UI",Tahoma,sans-serif;
            display:inline-flex;
            align-items:center;
            gap:10px;
            text-decoration:none;
            padding:14px 30px;
            font-size:12.5px;
            font-weight:700;
            letter-spacing:.1em;
            text-transform:uppercase;
            border-radius:2px;
            transition:all .35s cubic-bezier(.16,1,.3,1);
            border:none;
            cursor:pointer;
        }

        .primary{
            background:var(--gold-bg);
            color:#fff;
        }
        .primary:hover{
            background:var(--gold);
            letter-spacing:.14em;
        }

        .secondary{
            border:1px solid var(--line);
            color:var(--ink-dim);
            background:#fff;
        }
        .secondary:hover{
            border-color:var(--gold);
            color:var(--gold);
            letter-spacing:.14em;
        }

        .status-dot{
            display:inline-block;
            width:7px;
            height:7px;
            border-radius:50%;
            background:var(--gold);
            margin-right:8px;
            animation:pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse{
            0%,100%{ opacity:1; transform:scale(1); }
            50%{ opacity:.4; transform:scale(.75); }
        }

        .status-line{
            font-family:"Segoe UI",Tahoma,sans-serif;
            margin-top:26px;
            font-size:12px;
            font-weight:600;
            letter-spacing:.08em;
            text-transform:uppercase;
            color:var(--ink-dim);
        }

        .footer{
            margin-top:52px;
            font-family:"Segoe UI",Tahoma,sans-serif;
            color:#a6abb5;
            font-size:11.5px;
            letter-spacing:.06em;
            text-transform:uppercase;
        }

        @media(max-width:600px){
            .card{ padding:48px 26px; }
            .btn-group{ flex-direction:column; }
            .btn{ width:100%; justify-content:center; }
        }
    </style>
</head>
<body>

<div class="card">

    <img
        src="/assets/logo-osis.png"
        class="logo"
        alt="Logo OSIS SMKN 1 Bantul">

    <div class="eyebrow">OSIS SMKN 1 Bantul</div>

    <div class="error">503</div>

    <div class="rule"></div>

    <h1>Server Sedang Sibuk</h1>

    <p>
        Website sedang mengalami lonjakan trafik atau dalam pemeliharaan singkat.
        Silakan muat ulang halaman ini dalam beberapa saat.
    </p>

    <div class="status-line">
        <span class="status-dot"></span>Memeriksa status server
    </div>

    <div class="btn-group">
        <button class="btn primary" onclick="location.reload()">Muat Ulang Halaman</button>
        <a href="/" class="btn secondary">Kembali ke Beranda</a>
    </div>

    <div class="footer">© 2026 OSIS SMKN 1 Bantul</div>

</div>

</body>
</html>
